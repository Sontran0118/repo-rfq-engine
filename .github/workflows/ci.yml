name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rfq_engine_test
          MYSQL_USER: rfq
          MYSQL_PASSWORD: rfq
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Track go.mod so CI cannot drift from the toolchain the code needs.
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - run: go vet ./cmd/... ./internal/...

      # The integration tests skip when MySQL is unreachable, so the DSN is set
      # explicitly here — CI must exercise the row-lock path, not skip past it.
      - name: Test with race detector
        env:
          RFQ_TEST_DSN: 'rfq:rfq@tcp(127.0.0.1:3306)/rfq_engine_test?parseTime=true&loc=UTC'
        run: go test ./cmd/... ./internal/... -p 1 -race -cover

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
